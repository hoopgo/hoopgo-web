<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Yönetici Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1322; color: #ffffff; padding: 24px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #1f2d5a; padding-bottom: 16px; }
        .title { font-size: 20px; font-weight: 700; color: #ffffff; }
        .badge-count { background: #2563eb; color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

        .table-wrapper { background: #131c31; border: 1px solid #1f2d5a; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #0b1329; color: #8a99ad; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px; border-bottom: 1px solid #1f2d5a; }
        td { padding: 14px 16px; border-bottom: 1px solid #1f2d5a; color: #e2e8f0; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-approved { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-rejected { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

        .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; margin-right: 4px; transition: 0.2s; }
        .btn-approve { background: #10b981; color: #fff; }
        .btn-approve:hover { background: #059669; }
        .btn-reject { background: #ef4444; color: #fff; }
        .btn-reject:hover { background: #dc2626; }

        .empty-state { text-align: center; padding: 40px; color: #8a99ad; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">🔑 hoop Yönetici - Esnaf Başvuruları</div>
        <div class="badge-count" id="totalCount">0 Başvuru</div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>İşletme Adı</th>
                    <th>Kategori</th>
                    <th>Adres / Nirengi</th>
                    <th>Yetkili</th>
                    <th>Telefon</th>
                    <th>Durum</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="applicationList">
            </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">Henüz başvuru bulunmuyor.</div>
    </div>
</div>

<script>
    function loadApplications() {
        const applications = JSON.parse(localStorage.getItem('hoop_esnaf_basvurulari')) || [];
        const tbody = document.getElementById('applicationList');
        const emptyState = document.getElementById('emptyState');
        const totalCount = document.getElementById('totalCount');

        tbody.innerHTML = '';
        totalCount.textContent = `${applications.length} Başvuru`;

        if (applications.length === 0) {
            emptyState.style.display = 'block';
            return;
        }

        emptyState.style.display = 'none';

        applications.forEach((app, index) => {
            const tr = document.createElement('tr');

            let statusClass = 'status-pending';
            let statusText = 'Beklemede';
            if (app.status === 'Onaylandı') { statusClass = 'status-approved'; statusText = 'Onaylandı'; }
            if (app.status === 'Reddedildi') { statusClass = 'status-rejected'; statusText = 'Reddedildi'; }

            tr.innerHTML = `
                <td style="font-weight: 600;">${app.isletmeAdi}</td>
                <td>${app.kategori}</td>
                <td>${app.adres}</td>
                <td>${app.yetkili}</td>
                <td>${app.telefon}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>
                    ${app.status === 'Beklemede' ? `
                        <button class="btn-action btn-approve" onclick="updateStatus(${index}, 'Onaylandı')">Onayla</button>
                        <button class="btn-action btn-reject" onclick="updateStatus(${index}, 'Reddedildi')">Reddet</button>
                    ` : '-'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateStatus(index, newStatus) {
        let applications = JSON.parse(localStorage.getItem('hoop_esnaf_basvurulari')) || [];
        applications[index].status = newStatus;
        localStorage.setItem('hoop_esnaf_basvurulari', JSON.stringify(applications));
        loadApplications();
    }

    loadApplications();
</script>

</body>
</html>

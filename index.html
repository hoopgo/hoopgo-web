<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop Ortaköy - Canlı Fırsatlar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Derin ve canlı lacivert zemin */
            background: linear-gradient(135deg, #0b1120 0%, #111827 50%, #1e1b4b 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        /* Header / Logo Alanı */
        header {
            text-align: center;
            padding: 10px 0 20px 0;
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            object-fit: contain;
        }

        /* Konum Sol, Canlı Fırsatlar Sağ Hizalama */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .location-tag {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Yanıp Sönen CANLI FIRSATLAR (Sağda) */
        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
            animation: pulse-border 1.8s infinite;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.2); }
            50% { box-shadow: 0 0 16px rgba(239, 68, 68, 0.6); }
            100% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.2); }
        }

        /* Fırsat Kartı */
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .store-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #f3f4f6;
        }

        .time-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .offer-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .offer-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* Stok Kutusu */
        .stock-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            width: fit-content;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 15px;
        }

        .old-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 1.1rem;
        }

        /* Neon Yeşil İndirimli Fiyat */
        .new-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .btn-claim {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
        }

        .btn-claim:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <header>
            <img src="logo.png" alt="hoop" class="logo-img">
        </header>

        <!-- Sol: Ortaköy, Beşiktaş | Sağ: CANLI FIRSATLAR -->
        <div class="top-bar">
            <div class="location-tag">
                📍 Ortaköy, Beşiktaş
            </div>
            <div class="live-badge">
                <span class="pulse-dot"></span>
                CANLI FIRSATLAR
            </div>
        </div>

        <!-- Örnek Fırsat Kartı (750 TL -> Neon Yeşil / 15 Kilo / 21:00) -->
        <div class="card">
            <div class="store-header">
                <span class="store-name">Ortaköy Şarküteri</span>
                <span class="time-badge">⏰ 21:00'a kadar</span>
            </div>
            <div class="offer-title">Eski Kaşar Peyniri</div>
            <div class="offer-desc">Taze taze kesilmiş, Kars yöresine ait lezzetli eski kaşar.</div>
            
            <div class="stock-info">
                📦 Stok: <strong>15 Kilo</strong> kaldı
            </div>

            <div class="price-row">
                <span class="old-price">1000 TL</span>
                <span class="new-price">750 TL / kg</span>
            </div>

            <button class="btn-claim">Fırsatı Yakala</button>
        </div>

    </div>

</body>
</html>

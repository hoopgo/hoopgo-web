<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Mahallendeki Fırsatları Keşfet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #0a0f1d;
            min-height: 100vh;
            padding: 24px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER SECTION */
        .header {
            text-align: center;
            margin-top: 16px;
            margin-bottom: 32px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* EXACT VECTOR LOGO */
        .logo-svg {
            width: 210px;
            height: auto;
            display: block;
        }

        .tagline {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
            letter-spacing: -0.2px;
        }

        /* COUPON CARDS */
        .cards-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .card-stock {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .code-box {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background-color: #0b0f19;
        }

        .code-number {
            font-size: 26px;
            font-weight: 800;
            color: #e5e7eb;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .code-desc {
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER / PERFECT VECTOR LOGO -->
        <div class="header">
            <svg class="logo-svg" viewBox="0 0 320 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- h -->
                <path d="M 35 25 C 41 25 45 29 45 35 L 45 50 C 50 43 58 40 67 40 C 80 40 88 48 88 63 L 88 85 C 88 91 84 95 78 95 C 72 95 68 91 68 85 L 68 67 C 68 58 63 54 55 54 C 48 54 45 59 45 67 L 45 85 C 45 91 41 95 35 95 C 29 95 25 91 25 85 L 25 35 C 25 29 29 25 35 25 Z" fill="#F5F5F7"/>
                
                <!-- Blue Ring (First o) -->
                <path d="M 125 40 C 140 40 152 52 152 67 C 152 82 140 94 125 94 C 110 94 98 82 98 67 C 98 52 110 40 125 40 Z M 125 54 C 118 54 112 60 112 67 C 112 74 118 80 125 80 C 132 80 138 74 138 67 C 138 60 132 54 125 54 Z" fill="#0066FF"/>
                
                <!-- Green Ring (Second o) -->
                <path d="M 175 40 C 190 40 202 52 202 67 C 202 82 190 94 175 94 C 160 94 148 82 148 67 C 148 52 160 40 175 40 Z M 175 54 C 168 54 162 60 162 67 C 162 74 168 80 175 80 C 182 80 188 74 188 67 C 188 60 182 54 175 54 Z" fill="#7CA954"/>
                
                <!-- Intersection Loop Effect -->
                <path d="M 148 56 C 152 51 158 48 164 48 C 160 53 158 59 158 67 C 158 75 160 81 164 86 C 158 86 152 83 148 78 C 144 72 144 62 148 56 Z" fill="#0066FF" opacity="0.9"/>

                <!-- p -->
                <path d="M 235 40 C 249 40 260 51 260 67 C 260 83 249 94 235 94 C 226 94 218 89 214 82 L 214 105 C 214 111 210 115 204 115 C 198 115 194 111 194 105 L 194 45 C 194 39 198 35 204 35 C 210 35 214 39 214 45 L 214 52 C 218 45 226 40 235 40 Z M 231 54 C 223 54 214 60 214 67 C 214 74 223 80 231 80 C 239 80 246 74 246 67 C 246 60 239 54 231 54 Z" fill="#F5F5F7"/>
            </svg>
            <div class="tagline">Mahallendeki fırsatları keşfet.</div>
        </div>

        <!-- CARDS -->
        <div class="cards-list">
            <div class="card">
                <div class="card-title">Ortaköy Fırıncısı</div>
                <div class="card-subtitle">%20 Taze & Kruvasan İndirimi</div>
                <div class="card-stock">Kalan Stok: 12/20</div>
                <div class="code-box">
                    <div class="code-number">A-27</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Kahve Durağı Ortaköy</div>
                <div class="card-subtitle">Filtre Kahvede 1Al 1Öde</div>
                <div class="card-stock">Kalan Stok: 5/15</div>
                <div class="code-box">
                    <div class="code-number">K-10</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

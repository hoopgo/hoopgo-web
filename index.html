<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Mahallendeki Fırsatları Keşfet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #070a14;
            min-height: 100vh;
            padding: 28px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER SECTION */
        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 28px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            width: 220px;
            height: auto;
            display: block;
        }

        .tagline {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            margin-top: 12px;
            letter-spacing: -0.2px;
        }

        /* COUPON CARDS */
        .cards-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .card-stock {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .code-box {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background-color: #0b0f19;
        }

        .code-number {
            font-size: 26px;
            font-weight: 800;
            color: #e5e7eb;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .code-desc {
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER / DIRECT SVG LOGO EMBEDDED -->
        <div class="header">
            <svg class="main-logo" viewBox="0 0 500 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- h -->
                <path d="M70 40 C70 30 80 30 85 30 C90 30 100 30 100 40 L100 70 C110 52 130 48 150 48 C185 48 200 70 200 105 L200 150 C200 160 190 160 185 160 C180 160 170 160 170 150 L170 110 C170 85 155 76 138 76 C118 76 100 90 100 115 L100 150 C100 160 90 160 85 160 C80 160 70 160 70 150 L70 40 Z" fill="#F5F5F7"/>
                
                <!-- Blue Ring -->
                <circle cx="230" cy="115" r="42" stroke="#0066FF" stroke-width="26"/>
                
                <!-- Green Ring -->
                <circle cx="310" cy="115" r="42" stroke="#7CA954" stroke-width="26"/>
                
                <!-- Overlap Clip -->
                <g clip-path="url(#ring-clip)">
                    <circle cx="230" cy="115" r="42" stroke="#0066FF" stroke-width="26"/>
                </g>
                <defs>
                    <clipPath id="ring-clip">
                        <rect x="270" y="70" width="40" height="45"/>
                    </clipPath>
                </defs>

                <!-- p -->
                <path d="M410 48 C445 48 475 75 475 115 C475 155 445 182 410 182 C390 182 375 172 365 158 L365 190 C365 200 355 200 350 200 C345 200 335 200 335 190 L335 60 C335 50 345 50 350 50 C355 50 365 50 365 60 L365 72 C375 58 390 48 410 48 Z M402 76 C380 76 365 92 365 115 C365 138 380 154 402 154 C425 154 442 138 442 115 C442 92 425 76 402 76 Z" fill="#F5F5F7"/>
            </svg>
            <div class="tagline">Mahallendeki fırsatları keşfet.</div>
        </div>

        <!-- CARDS -->
        <div class="cards-list">
            <div class="card">
                <div class="card-title">Ortaköy Fırıncısı</div>
                <div class="card-subtitle">%20 Taze & Kruvasan İndirimi</div>
                <div class="card-stock">Kalan Stok: 12/20</div>
                <div class="code-box">
                    <div class="code-number">A-27</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Kahve Durağı Ortaköy</div>
                <div class="card-subtitle">Filtre Kahvede 1Al 1Öde</div>
                <div class="card-stock">Kalan Stok: 5/15</div>
                <div class="code-box">
                    <div class="code-number">K-10</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop. - Ortaköy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; min-height: 100vh; padding: 16px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 420px; }
        
        /* LOGO ALANI - ORİJİNAL LOGOYU BÜYÜTEN VE DÜZELTEN DÜZEN */
        .header { text-align: center; margin-bottom: 20px; padding-top: 10px; display: flex; flex-direction: column; align-items: center; }
        .logo-box { width: 100%; max-width: 240px; height: 75px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .logo-box img { width: 300px; height: auto; object-fit: cover; }
        .subtitle { font-size: 13px; color: #8a99ad; margin-top: 6px; font-weight: 500; }

        .location-bar { background: #0f1a36; border: 1px solid #1f2d5a; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .loc-title { font-size: 13px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 6px; }
        .live-badge { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; }

        .feed-container { display: flex; flex-direction: column; gap: 14px; }

        /* ESNAF KARTI VE FİYAT YAPISI */
        .deal-card { background: #0f1a36; border: 1px solid #1f2d5a; border-radius: 16px; padding: 14px; position: relative; }
        .card-top { display: flex; gap: 12px; }
        .card-img { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; background: #131c31; flex-shrink: 0; }
        
        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
        .shop-name { font-size: 11px; font-weight: 800; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.5px; }
        .deal-title { font-size: 15px; font-weight: 800; color: #ffffff; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shop-address { font-size: 11px; color: #8a99ad; margin-bottom: 6px; }

        /* FİYATLARIN KINILMASINI VE BUTONLA ÇAKIŞMASINI ENGELLEYEN DÜZEN */
        .price-row { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
        .old-price { font-size: 12px; color: #64748b; text-decoration: line-through; font-weight: 600; white-space: nowrap; }
        .new-price { font-size: 18px; font-weight: 900; color: #10b981; white-space: nowrap; }

        .coupon-btn { position: absolute; right: 14px; bottom: 42px; background: #2563eb; color: #ffffff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }

        .card-footer-info { display: flex; gap: 12px; font-size: 10px; font-weight: 700; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
        .stok-text { color: #3b82f6; }
        .saat-text { color: #f59e0b; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="logo-box">
            <img src="logo.png" alt="hoop">
        </div>
        <div class="subtitle">Mahallendeki Fırsatları Yakala</div>
    </div>

    <div class="location-bar">
        <div class="loc-title">📍 Ortaköy, Beşiktaş</div>
        <div class="live-badge">• CANLI FIRSATLAR</div>
    </div>

    <div class="feed-container" id="publicVitrinFeed">
        <div class="deal-card">
            <div class="card-top">
                <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=300&auto=format&fit=crop" class="card-img" alt="Ürün">
                <div class="card-info">
                    <div>
                        <div class="shop-name">EFE KASAP</div>
                        <div class="deal-title">dana kıyma</div>
                        <div class="shop-address">📍 dereboyu cd no 22</div>
                    </div>
                    <div class="price-row">
                        <span class="old-price">1000 TL</span>
                        <span class="new-price">750 TL</span>
                    </div>
                </div>
            </div>
            <button class="coupon-btn">KUPON AL</button>
            <div class="card-footer-info">
                <span class="stok-text">Stok: 15 Adet</span>
                <span class="saat-text">Saat: (21:00)</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>

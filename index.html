<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Mahallendeki Fırsatları Keşfet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #070a14;
            min-height: 100vh;
            padding: 28px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER SECTION */
        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 28px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            width: 220px;
            height: auto;
            display: block;
        }

        .tagline {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            margin-top: 14px;
            letter-spacing: -0.2px;
        }

        /* COUPON CARDS */
        .cards-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .card-stock {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .code-box {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background-color: #0b0f19;
        }

        .code-number {
            font-size: 26px;
            font-weight: 800;
            color: #e5e7eb;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .code-desc {
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER / PURE EMBEDDED LOGO -->
        <div class="header">
            <svg class="main-logo" viewBox="0 0 340 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- h -->
                <path d="M 30 18 C 38 18 44 24 44 32 L 44 48 C 50 38 60 34 72 34 C 88 34 100 44 100 62 L 100 84 C 100 92 94 98 86 98 C 78 98 72 92 72 84 L 72 65 C 72 55 65 50 56 50 C 48 50 44 55 44 65 L 44 84 C 44 92 38 98 30 98 C 22 98 16 92 16 84 L 16 32 C 16 24 22 18 30 18 Z" fill="#F5F5F7"/>
                
                <!-- Blue Ring (First o) -->
                <circle cx="138" cy="66" r="28" stroke="#0066FF" stroke-width="16"/>
                
                <!-- Green Ring (Second o) -->
                <circle cx="192" cy="66" r="28" stroke="#7CA954" stroke-width="16"/>
                
                <!-- Intersecting Overlap Ring Arc -->
                <path d="M 162 43 C 168 49 172 57 172 66 C 172 75 168 83 162 89 C 158 83 155 75 155 66 C 155 57 158 49 162 43 Z" fill="#0066FF"/>

                <!-- p -->
                <path d="M 258 34 C 276 34 290 47 290 66 C 290 85 276 98 258 98 C 248 98 238 92 232 84 L 232 106 C 232 114 226 120 218 120 C 210 120 204 114 204 106 L 204 42 C 204 34 210 28 218 28 C 226 28 232 34 232 42 L 232 48 C 238 39 248 34 258 34 Z M 254 52 C 244 52 232 58 232 66 C 232 74 244 80 254 80 C 264 80 272 74 272 66 C 272 58 264 52 254 52 Z" fill="#F5F5F7"/>
            </svg>
            <div class="tagline">Mahallendeki fırsatları keşfet.</div>
        </div>

        <!-- CARDS -->
        <div class="cards-list">
            <div class="card">
                <div class="card-title">Ortaköy Fırıncısı</div>
                <div class="card-subtitle">%20 Taze & Kruvasan İndirimi</div>
                <div class="card-stock">Kalan Stok: 12/20</div>
                <div class="code-box">
                    <div class="code-number">A-27</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Kahve Durağı Ortaköy</div>
                <div class="card-subtitle">Filtre Kahvede 1Al 1Öde</div>
                <div class="card-stock">Kalan Stok: 5/15</div>
                <div class="code-box">
                    <div class="code-number">K-10</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

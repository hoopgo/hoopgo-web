<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Ortaköy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }
        
        .logo-area { text-align: center; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        .logo-box { width: 100%; max-width: 220px; height: 75px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .logo-box img { width: 280px; height: auto; object-fit: cover; }
        .subtitle { font-size: 13px; color: #8a99ad; margin-top: 6px; font-weight: 500; }

        .location-tag { background: #131c31; border: 1px solid #1f2d5a; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #cbd5e1; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; }
        .live-tag { background: #2563eb; color: #ffffff; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }

        .card { width: 100%; background: #131c31; border: 1px solid #1f2d5a; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; position: relative; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .card-img { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
        .card-content { flex: 1; min-width: 0; }
        .shop-name { font-size: 10px; font-weight: 800; color: #2563eb; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .product-title { font-size: 15px; font-weight: 800; color: #ffffff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .address-text { font-size: 10px; color: #8a99ad; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
        .price-container { display: flex; align-items: baseline; gap: 8px; }
        .old-price { font-size: 11px; color: #64748b; text-decoration: line-through; }
        .new-price { font-size: 16px; font-weight: 900; color: #ffffff; }
        .action-btn { background: #00d2ff; color: #0b1329; border: none; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; cursor: pointer; flex-shrink: 0; text-transform: uppercase; }

        .footer-divider { width: 100%; height: 1px; background-color: #1f2d5a; margin: 20px 0 16px 0; }
        .footer-esnaf-btn { width: 100%; background: #1a294d; border: 1px solid #2563eb; color: #ffffff; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .footer-esnaf-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <div class="logo-box">
            <img src="logo.png" alt="hoop">
        </div>
        <div class="subtitle">Mahallendeki Fırsatları Yakala</div>
    </div>

    <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 12px;">
        <div class="location-tag">📍 Ortaköy, Beşiktaş</div>
        <div class="live-tag">CANLI FIRSATLAR</div>
    </div>

    <!-- FIRSAT KARTLARI -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=300" class="card-img" alt="Dana Kıyma">
        <div class="card-content">
            <div class="shop-name">ORTAKÖY KASABI</div>
            <div class="product-title">Kıyma (1 kg)</div>
            <div class="address-text">📍 Dereboyu Cde. No: 12</div>
            <div class="price-container">
                <span class="old-price">1000 TL</span>
                <span class="new-price">750 TL</span>
            </div>
            <div style="font-size: 9px; color: #38bdf8; margin-top: 4px; font-weight: 700;">Stok: 15 Adet | Saat: (21:00)</div>
        </div>
        <button class="action-btn">KUPON AL</button>
    </div>

    <!-- AYRIÇ ÇİZGİSİ VE İKONLU ESNAF BUTONU -->
    <div class="footer-divider"></div>
    <a href="esnaf.html" class="footer-esnaf-btn">🏷️ Esnaf Girişi / Kayıt</a>
</div>

</body>
</html>

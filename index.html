<!-- HEADER & LOGO ALANI (ISLEM 1) -->
<header class="header-section">
  <div class="logo-container">
    <!-- hoop logosu (SVG İç İçe Geçen Mavi & Yeşil Halkalar) -->
    <svg class="hoop-logo" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Mavi Halka Mavi-Lacivert Gradient -->
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0088FF" />
          <stop offset="100%" stop-color="#0055FF" />
        </linearGradient>
        <!-- Yeşil Halka Yeşil-Zeytin Gradient -->
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#9ACD32" />
          <stop offset="100%" stop-color="#6B8E23" />
        </linearGradient>
      </defs>

      <!-- h harfi -->
      <path d="M 30,30 L 30,90 M 30,55 C 30,45 45,45 50,55 L 50,90" 
            fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Yeşil Halka (Arka Kısım) -->
      <circle cx="150" cy="65" r="24" fill="none" stroke="url(#greenGrad)" stroke-width="14" />

      <!-- Mavi Halka (İçte Kesişen Tam Halka) -->
      <circle cx="110" cy="65" r="24" fill="none" stroke="url(#blueGrad)" stroke-width="14" />

      <!-- Kesişim Yanılsaması İçin Yeşil Üst Yay -->
      <path d="M 135,47 A 24 24 0 0 1 160,47" 
            fill="none" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round" />

      <!-- p harfi -->
      <path d="M 200,45 L 200,105 M 200,45 C 220,45 220,85 200,85" 
            fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Yanındaki Ufak Renkli 'go' -->
    <span class="go-text">
      <span class="g-blue">g</span><span class="o-green">o</span>
    </span>
  </div>

  <!-- Slogan -->
  <p class="tagline">Mahallendeki Fırsatları Yakala</p>
</header>

<style>
  .header-section {
    text-align: center;
    padding: 20px 10px;
    background-color: #080e18; /* Koyu lacivert zemin */
  }

  .logo-container {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .hoop-logo {
    width: 170px;
    height: 65px;
  }

  /* Ufak renkli 'go' yazısı */
  .go-text {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 26px;
    font-weight: 800;
    margin-left: 4px;
    margin-top: 5px;
    letter-spacing: -0.5px;
  }

  .g-blue {
    color: #0088FF; /* Mavi halka rengi */
  }

  .o-green {
    color: #9ACD32; /* Yeşil halka rengi */
  }

  /* Slogan */
  .tagline {
    color: #9ea8b6;
    font-size: 14px;
    font-weight: 500;
    margin-top: 4px;
    margin-bottom: 0;
    font-family: system-ui, -apple-system, sans-serif;
    letter-spacing: 0.2px;
  }
</style>

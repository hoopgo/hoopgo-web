<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoop - Ortaköy Mahallesi Canlı Fırsatlar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #060913; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 16px 12px; }
        .app-container { width: 100%; max-width: 420px; background-color: #070a14; min-height: 100vh; padding: 20px 16px; border-radius: 24px; border: 1px solid #1e293b; box-shadow: 0 20px 40px rgba(0,0,0,0.6); position: relative; }
        
        .header { text-align: center; margin-bottom: 24px; }
        .logo { font-size: 26px; font-weight: 800; color: #38bdf8; letter-spacing: -0.5px; }
        .sub-title { font-size: 14px; font-weight: 700; color: #94a3b8; margin-top: 4px; }

        .deals-list { display: flex; flex-direction: column; gap: 14px; }
        .deal-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .deal-info { flex: 1; }
        .deal-title { font-size: 15px; font-weight: 800; color: #f8fafc; margin-bottom: 6px; }
        .price-box { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .old-price { font-size: 13px; color: #64748b; text-decoration: line-through; font-weight: 600; }
        .new-price { font-size: 17px; color: #38bdf8; font-weight: 800; }
        .meta-box { display: flex; gap: 10px; font-size: 11px; color: #94a3b8; font-weight: 700; }
        
        .btn-inspect { background: #2563eb; color: #ffffff; border: none; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }

        .esnaf-link { display: block; text-align: center; margin-top: 30px; padding: 12px; background: rgba(30, 41, 59, 0.5); border: 1px solid #1e293b; border-radius: 14px; color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 700; }

        /* AÇILIR PENCERE (MODAL) TASARIMI */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; padding: 16px; backdrop-filter: blur(4px); }
        .modal-content { background: #0f172a; width: 100%; max-width: 360px; border-radius: 20px; padding: 24px; border: 1px solid #1e293b; position: relative; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .close-modal { position: absolute; top: 12px; right: 16px; font-size: 28px; color: #64748b; cursor: pointer; font-weight: 500; }
        .modal-shop-name { font-size: 15px; font-weight: 800; color: #38bdf8; margin-bottom: 4px; }
        .modal-address { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 800; color: #f8fafc; margin-bottom: 12px; }
        .modal-price-box { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 24px; }
        
        .code-box { display: none; background: rgba(16, 185, 129, 0.1); border: 1px dashed #10b981; padding: 16px; border-radius: 12px; color: #10b981; margin-bottom: 16px; }
        .code-text { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
        .code-info { font-size: 11px; margin-top: 6px; color: #94a3b8; }
        
        .btn-generate { width: 100%; background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">hoop</div>
            <div class="sub-title">Ortaköy Mahallesi Canlı Fırsatları</div>
        </div>

        <!-- İLANLAR BURAYA GELECEK -->
        <div id="dealsContainer" class="deals-list"></div>

        <a href="esnaf.html" class="esnaf-link">🔒 hoop - Esnaf Girişi</a>
    </div>

    <!-- İNCELE (MODAL) EKRANI -->
    <div id="dealModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">×</span>
            <div class="modal-shop-name">Ortaköy Esnafı</div>
            <div class="modal-address">📍 Dereboyu Cad. Ortaköy</div>
            
            <h3 id="modalTitle" class="modal-title">Fırsat Adı</h3>
            <div class="modal-price-box">
                <span id="modalOldPrice" class="old-price"></span>
                <span id="modalNewPrice" class="new-price"></span>
            </div>
            
            <div id="codeBox" class="code-box">
                <div class="code-text" id="generatedCode">H-0000</div>
                <div class="code-info">Bu kodu dükkanda esnafa gösterin.</div>
            </div>
            
            <button id="generateBtn" class="btn-generate" onclick="generateCode()">Fırsatı Yakala & Kod Üret 🚀</button>
        </div>
    </div>

    <script>
        // Sayfa açıldığında hafızadaki ilanları yükler
        function loadDeals() {
            const container = document.getElementById('dealsContainer');
            const deals = JSON.parse(localStorage.getItem('hoop_deals') || '[]');

            // Eğer hiç ilan yoksa varsayılan bir tane gösterelim
            if (deals.length === 0) {
                deals.push({
                    title: 'Özel Karışık Kumpir + İçecek',
                    oldPrice: '1000 TL',
                    newPrice: '750 TL',
                    time: 'Saat 22:00\'ye kadar',
                    stock: '5 Adet'
                });
            }

            container.innerHTML = ''; // İçini temizle

            deals.forEach(deal => {
                const card = document.createElement('div');
                card.className = 'deal-card';
                card.innerHTML = `
                    <div class="deal-info">
                        <div class="deal-title">${deal.title}</div>
                        <div class="price-box">
                            ${deal.oldPrice ? `<span class="old-price">${deal.oldPrice}</span>` : ''}
                            <span class="new-price">${deal.newPrice}</span>
                        </div>
                        <div class="meta-box">
                            <span>⏳ ${deal.time}</span>
                            <span>⚡ Stok: ${deal.stock}</span>
                        </div>
                    </div>
                    <button class="btn-inspect">İncele ➔</button>
                `;
                
                // İncele Butonuna Tıklanma Özelliği Ekleme
                const inspectBtn = card.querySelector('.btn-inspect');
                inspectBtn.onclick = () => openModal(deal.title, deal.oldPrice, deal.newPrice);
                
                container.prepend(card); // En yeni ekleneni en üste koyar
            });
        }

        // Modal (Açılır Pencere) Fonksiyonları
        function openModal(title, oldPrice, newPrice) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalOldPrice').innerText = oldPrice || '';
            document.getElementById('modalNewPrice').innerText = newPrice;
            
            // Kod kutusunu gizle, butonu göster (Her açılışta sıfırlamak için)
            document.getElementById('codeBox').style.display = 'none';
            document.getElementById('generateBtn').style.display = 'block';
            
            document.getElementById('dealModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('dealModal').style.display = 'none';
        }

        // Rastgele Kupon Kodu Üretme
        function generateCode() {
            const randomCode = 'H-' + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('generatedCode').innerText = randomCode;
            
            document.getElementById('generateBtn').style.display = 'none';
            document.getElementById('codeBox').style.display = 'block';
        }

        window.onload = loadDeals;
    </script>
</body>
</html>

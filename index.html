<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Mahallendeki Fırsatları Keşfet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #070a14;
            min-height: 100vh;
            padding: 28px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER & LOGO SECTION */
        .header {
            text-align: center;
            margin-top: 12px;
            margin-bottom: 32px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrapper {
            width: 220px;
            height: auto;
            display: block;
        }

        .tagline {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            margin-top: 14px;
            letter-spacing: -0.2px;
        }

        /* COUPON CARDS */
        .cards-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .card-stock {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .code-box {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background-color: #0b0f19;
        }

        .code-number {
            font-size: 26px;
            font-weight: 800;
            color: #e5e7eb;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .code-desc {
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER / LOGO & SLOGAN -->
        <div class="header">
            <svg class="logo-wrapper" viewBox="0 0 340 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- h -->
                <path d="M 28 20 C 35 20 40 25 40 32 L 40 46 C 45 38 54 35 64 35 C 78 35 88 44 88 60 L 88 82 C 88 89 83 94 76 94 C 69 94 64 89 64 82 L 64 63 C 64 54 58 50 50 50 C 43 50 40 55 40 63 L 40 82 C 40 89 35 94 28 94 C 21 94 16 89 16 82 L 16 32 C 16 25 21 20 28 20 Z" fill="#F5F5F7"/>
                
                <!-- Blue Ring (First o) -->
                <circle cx="128" cy="64" r="28" stroke="#0066FF" stroke-width="16"/>
                
                <!-- Green Ring (Second o) -->
                <circle cx="178" cy="64" r="28" stroke="#7CA954" stroke-width="16"/>
                
                <!-- Overlap / Loop Effect -->
                <path d="M 150 44 C 158 50 162 57 162 64 C 162 71 158 78 150 84 C 146 78 144 71 144 64 C 144 57 146 50 150 44 Z" fill="#0066FF"/>

                <!-- p -->
                <path d="M 242 35 C 258 35 270 47 270 64 C 270 81 258 93 242 93 C 232 93 224 88 219 80 L 219 104 C 219 111 214 116 207 116 C 200 116 195 111 195 104 L 195 43 C 195 36 200 31 207 31 C 214 31 219 36 219 43 L 219 48 C 224 40 232 35 242 35 Z M 238 51 C 230 51 221 57 221 64 C 221 71 230 77 238 77 C 246 77 254 71 254 64 C 254 57 246 51 238 51 Z" fill="#F5F5F7"/>
            </svg>
            <div class="tagline">Mahallendeki fırsatları keşfet.</div>
        </div>

        <!-- CARDS -->
        <div class="cards-list">
            <div class="card">
                <div class="card-title">Ortaköy Fırıncısı</div>
                <div class="card-subtitle">%20 Taze & Kruvasan İndirimi</div>
                <div class="card-stock">Kalan Stok: 12/20</div>
                <div class="code-box">
                    <div class="code-number">A-27</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Kahve Durağı Ortaköy</div>
                <div class="card-subtitle">Filtre Kahvede 1Al 1Öde</div>
                <div class="card-stock">Kalan Stok: 5/15</div>
                <div class="code-box">
                    <div class="code-number">K-10</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

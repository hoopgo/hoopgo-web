<!DOCTYPE html>
<html lang="tr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoop go - Mahallendeki Fırsatları Yakala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #030712; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
        .app-container { width: 100%; max-width: 420px; background-color: #070a14; min-height: 100vh; padding: 16px; border-radius: 20px; border: 1px solid #1e293b; display: flex; flex-direction: column; }
        
        /* HEADER & LOGO (KİLİTLİ) */
        .header-section { text-align: center; padding: 12px 0 16px 0; }
        .logo-box { display: inline-flex; align-items: flex-end; justify-content: center; gap: 4px; }

        .logo-text { 
            font-size: 38px; 
            font-weight: 800; 
            color: #ffffff; 
            letter-spacing: -1px; 
            display: flex; 
            align-items: center; 
            line-height: 1;
        }

        .oo-rings { display: inline-flex; align-items: center; position: relative; margin: 0 1px; transform: translateY(3px); }
        .ring-b { width: 22px; height: 22px; border: 5px solid #0088FF; border-radius: 50%; display: inline-block; margin-right: -8px; z-index: 1; }
        .ring-g { width: 22px; height: 22px; border: 5px solid #9ACD32; border-radius: 50%; display: inline-block; z-index: 2; }

        .go-tag { 
            font-size: 16px; 
            font-weight: 800; 
            margin-bottom: 2px;
            margin-left: 2px;
            line-height: 1;
        }
        .g-b { color: #0088FF; }
        .o-g { color: #9ACD32; }

        .tagline { color: #94a3b8; font-size: 13px; font-weight: 600; margin-top: 6px; }

        /* LOKASYON & İLANLAR */
        .location-bar { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 12px; font-weight: 700; color: #e2e8f0; }
        .badge-live { background: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: 800; border: 1px solid rgba(34, 197, 94, 0.3); }

        .deals-list { display: flex; flex-direction: column; gap: 14px; flex: 1; margin-bottom: 20px; }
        .deal-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 12px; display: flex; gap: 10px; align-items: center; }
        .deal-img { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; border: 1px solid #334155; flex-shrink: 0; }
        
        .deal-info { flex: 1; min-width: 0; }
        .shop-name { font-size: 10px; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 2px; }
        .deal-title { font-size: 15px; font-weight: 800; color: #f8fafc; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shop-address { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        
        .price-box { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
        .old-price { font-size: 12px; color: #64748b; text-decoration: line-through; font-weight: 600; }
        .new-price { font-size: 16px; color: #22c55e; font-weight: 800; }
        
        .meta-box { display: flex; gap: 4px; flex-wrap: wrap; }
        .meta-tag { background: #1e293b; color: #38bdf8; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
        .meta-time { background: #1e293b; color: #f59e0b; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }

        .btn-claim { background: #38bdf8; color: #0f172a; border: none; padding: 8px 10px; border-radius: 10px; font-weight: 800; font-size: 11px; cursor: pointer; flex-shrink: 0; }

        /* EN ALT ESNAF GİRİŞİ ALANI */
        .footer-esnaf { margin-top: auto; padding-top: 12px; border-top: 1px solid #1e293b; text-align: center; }
        .btn-esnaf-footer { background: #0f172a; color: #38bdf8; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-esnaf-footer:hover { border-color: #38bdf8; background: #1e293b; }
    </style>
</head>
<body class="notranslate" translate="no">
    <div class="app-container">
        <!-- HEADER -->
        <header class="header-section">
            <div class="logo-box notranslate" translate="no">
                <div class="logo-text">
                    h<div class="oo-rings"><span class="ring-b"></span><span class="ring-g"></span></div>p
                </div>
                <div class="go-tag notranslate" translate="no">
                    <span class="g-b">g</span><span class="o-g">o</span>
                </div>
            </div>
            <p class="tagline">Mahallendeki Fırsatları Yakala</p>
        </header>

        <div class="location-bar">
            <span>📍 Ortaköy, Beşiktaş</span>
            <span class="badge-live">● CANLI FIRSATLAR</span>
        </div>

        <!-- İLAN LİSTESİ -->
        <div class="deals-list">
            <div class="deal-card">
                <img src="https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=200" class="deal-img" alt="Kıyma">
                <div class="deal-info">
                    <div class="shop-name">ORTAKÖY KASABI</div>
                    <div class="deal-title">Kıyma (1 kg)</div>
                    <div class="shop-address">📍 Dereboyu Cde. No: 12</div>
                    <div class="price-box">
                        <span class="old-price">1000 TL</span>
                        <span class="new-price">750 TL</span>
                    </div>
                    <div class="meta-box">
                        <span class="meta-tag">Stok: 15 Adet</span>
                        <span class="meta-time">Saat: ( 21 : 00 )</span>
                    </div>
                </div>
                <button class="btn-claim" onclick="getCoupon('Ortaköy Kasabı', 'Kıyma (1 kg)')">KUPON AL</button>
            </div>

            <div class="deal-card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" class="deal-img" alt="Kumpir">
                <div class="deal-info">
                    <div class="shop-name">ORTAKÖY KUMPİRCİSİ</div>
                    <div class="deal-title">Ortaköy Kumpir</div>
                    <div class="shop-address">📍 Meydan Sk. No: 4</div>
                    <div class="price-box">
                        <span class="old-price">220 TL</span>
                        <span class="new-price">160 TL</span>
                    </div>
                    <div class="meta-box">
                        <span class="meta-tag">Stok: 8/10</span>
                        <span class="meta-time">Saat: ( 19 : 45 )</span>
                    </div>
                </div>
                <button class="btn-claim" onclick="getCoupon('Ortaköy Kumpircisi', 'Ortaköy Kumpir')">KUPON AL</button>
            </div>
        </div>

        <!-- EN ALT ESNAF GİRİŞİ -->
        <footer class="footer-esnaf">
            <button class="btn-esnaf-footer" onclick="openEsnafPage()">🏷️ Esnaf Girişi / Kayıt</button>
        </footer>
    </div>

    <script>
        function openEsnafPage() {
            window.location.href = 'esnaf-kayit.html';
        }

        function getCoupon(shop, title) {
            const code = 'H-' + Math.floor(1000 + Math.random() * 9000);
            alert(`🎉 Tebrikler!\n\n${shop} - ${title} fırsatı için kodunuz: ${code}\n\nBu kodu 1 saat içinde esnafa göstererek indiriminizi alabilirsiniz.`);
        }
    </script>
</body>
</html>

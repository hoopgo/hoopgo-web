<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Mahallendeki Fırsatları Keşfet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #070a14;
            min-height: 100vh;
            padding: 28px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER & LOGO SECTION */
        .header {
            text-align: center;
            margin-top: 12px;
            margin-bottom: 32px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrapper {
            width: 240px;
            height: auto;
            display: block;
        }

        .tagline {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            margin-top: 14px;
            letter-spacing: -0.2px;
        }

        /* COUPON CARDS */
        .cards-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .card-stock {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .code-box {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background-color: #0b0f19;
        }

        .code-number {
            font-size: 26px;
            font-weight: 800;
            color: #e5e7eb;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .code-desc {
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER / LOGO & SLOGAN -->
        <div class="header">
            <svg class="logo-wrapper" viewBox="0 0 400 130" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- h -->
                <path d="M 45 25 C 52 25 58 31 58 38 L 58 55 C 65 47 75 43 86 43 C 103 43 115 54 115 74 L 115 97 C 115 104 109 110 102 110 C 95 110 89 104 89 97 L 89 77 C 89 67 82 62 73 62 C 64 62 58 67 58 77 L 58 97 C 58 104 52 110 45 110 C 38 110 32 104 32 97 L 32 38 C 32 31 38 25 45 25 Z" fill="#FFFFFF"/>

                <!-- Blue Ring (First o) -->
                <circle cx="155" cy="76" r="26" stroke="#0066FF" stroke-width="16"/>

                <!-- Green Ring (Second o) -->
                <circle cx="215" cy="76" r="26" stroke="#7CA954" stroke-width="16"/>

                <!-- Intersecting Overlap Loop -->
                <path d="M 181 53 C 189 59 194 67 194 76 C 194 85 189 93 181 99 C 178 93 176 85 176 76 C 176 67 178 59 181 53 Z" fill="#0066FF"/>

                <!-- p -->
                <path d="M 295 43 C 315 43 330 57 330 76 C 330 95 315 110 295 110 C 284 110 274 104 268 95 L 268 118 C 268 125 262 131 255 131 C 248 131 242 125 242 118 L 242 55 C 242 48 248 43 255 43 C 262 43 268 48 268 55 L 268 58 C 274 48 284 43 295 43 Z M 289 62 C 278 62 268 70 268 76 C 268 83 278 91 289 91 C 300 91 308 83 308 76 C 308 70 300 62 289 62 Z" fill="#FFFFFF"/>
            </svg>
            <div class="tagline">Mahallendeki fırsatları keşfet.</div>
        </div>

        <!-- CARDS -->
        <div class="cards-list">
            <div class="card">
                <div class="card-title">Ortaköy Fırıncısı</div>
                <div class="card-subtitle">%20 Taze & Kruvasan İndirimi</div>
                <div class="card-stock">Kalan Stok: 12/20</div>
                <div class="code-box">
                    <div class="code-number">A-27</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Kahve Durağı Ortaköy</div>
                <div class="card-subtitle">Filtre Kahvede 1Al 1Öde</div>
                <div class="card-stock">Kalan Stok: 5/15</div>
                <div class="code-box">
                    <div class="code-number">K-10</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Mahallendeki Fırsatları Keşfet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #070a14;
            min-height: 100vh;
            padding: 28px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER SECTION */
        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 28px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            width: 210px;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .tagline {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 500;
            margin-top: 12px;
            letter-spacing: -0.2px;
        }

        /* COUPON CARDS */
        .cards-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .card-stock {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .code-box {
            border: 2px dashed #374151;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            background-color: #0b0f19;
        }

        .code-number {
            font-size: 26px;
            font-weight: 800;
            color: #e5e7eb;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .code-desc {
            font-size: 11px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER / DIRECT LOGO IMAGE -->
        <div class="header">
            <img class="main-logo" src="https://i.ibb.co/6yqGvBw/hoop-logo.png" alt="hoop" onerror="this.src='logo.png'">
            <div class="tagline">Mahallendeki fırsatları keşfet.</div>
        </div>

        <!-- CARDS -->
        <div class="cards-list">
            <div class="card">
                <div class="card-title">Ortaköy Fırıncısı</div>
                <div class="card-subtitle">%20 Taze & Kruvasan İndirimi</div>
                <div class="card-stock">Kalan Stok: 12/20</div>
                <div class="code-box">
                    <div class="code-number">A-27</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Kahve Durağı Ortaköy</div>
                <div class="card-subtitle">Filtre Kahvede 1Al 1Öde</div>
                <div class="card-stock">Kalan Stok: 5/15</div>
                <div class="code-box">
                    <div class="code-number">K-10</div>
                    <div class="code-desc">Bu kod 1 saat geçerlidir. İşletmeye gösteriniz.</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

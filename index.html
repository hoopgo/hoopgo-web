<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop Ortaköy - Mahallendeki Fırsatları Yakala</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1322; color: #ffffff; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 420px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .logo-img { width: 150px; height: auto; display: block; margin: 0 auto 8px auto; }
        .tagline { font-size: 13px; color: #8a99ad; }

        .location-bar { background: #131c31; border: 1px solid #1f2d5a; border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .location { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .badge { background: rgba(16, 185, 129, 0.15); color: #10b981; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.3); }

        .esnaf-btn-wrapper { margin-top: 20px; }
        .esnaf-btn { width: 100%; background: #131c31; border: 1px solid #1f2d5a; color: #3b82f6; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="hoop" class="logo-img">
        <div class="tagline">Mahallendeki Fırsatları Yakala</div>
    </div>

    <div class="location-bar">
        <div class="location">📍 Ortaköy, Beşiktaş</div>
        <div class="badge">• CANLI FIRSATLAR</div>
    </div>

    <!-- İlan Kartları Alanı Temizlendi -->

    <div class="esnaf-btn-wrapper">
        <a href="esnaf.html" class="esnaf-btn">🏷️ Esnaf Girişi / Kayıt</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop Ortaköy - Canlı Fırsatlar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b1120 0%, #111827 50%, #1e1b4b 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        /* Header / Logo & Slogan */
        header {
            text-align: center;
            padding: 10px 0 20px 0;
        }

        .logo-img {
            max-width: 190px;
            height: auto;
            object-fit: contain;
            margin-bottom: 4px;
            background: transparent; /* Koyu kutu oluşmasını engeller */
        }

        .slogan {
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Konum ve Canlı Fırsatlar Barı */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .location-tag {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #f87171;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
            animation: pulse-border 1.8s infinite;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: pulse-dot 1.2s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.2); }
            50% { box-shadow: 0 0 16px rgba(239, 68, 68, 0.6); }
            100% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.2); }
        }

        /* Fırsat Kartı */
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .store-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .store-name {
            font-weight: 700;
            font-size: 1rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .store-address {
            font-size: 0.78rem;
            color: #cbd5e1;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .time-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Ürün Görselli İçerik Alanı */
        .card-body {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-bottom: 15px;
        }

        .product-img {
            width: 100px;
            height: 100px;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }

        .product-details {
            flex-grow: 1;
        }

        .offer-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .offer-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .stock-info {
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Fiyat ve Buton Alanı */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .price-group {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .old-price {
            text-decoration: line-through;
            color: #64748b;
            font-size: 0.95rem;
        }

        .new-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .btn-claim {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #0284c7, #2563eb);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>

                <span class="pulse-dot"></span>
                CANLI FIRSATLAR
            </div>
        </div>

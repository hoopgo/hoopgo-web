<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoop - Ortaköy Mahallesi Canlı Fırsatlar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #060913; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 16px 12px; }
        .app-container { width: 100%; max-width: 420px; background-color: #070a14; min-height: 100vh; padding: 20px 16px; border-radius: 24px; border: 1px solid #1e293b; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        .header { text-align: center; margin-bottom: 24px; }
        .logo { font-size: 26px; font-weight: 800; color: #38bdf8; letter-spacing: -0.5px; }
        .sub-title { font-size: 14px; font-weight: 700; color: #94a3b8; margin-top: 4px; }

        .deals-list { display: flex; flex-direction: column; gap: 14px; }
        .deal-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .deal-info { flex: 1; }
        .deal-title { font-size: 15px; font-weight: 800; color: #f8fafc; margin-bottom: 6px; }
        .price-box { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .old-price { font-size: 13px; color: #64748b; text-decoration: line-through; font-weight: 600; }
        .new-price { font-size: 17px; color: #38bdf8; font-weight: 800; }
        .meta-box { display: flex; gap: 10px; font-size: 11px; color: #94a3b8; font-weight: 700; }
        
        .btn-inspect { background: #2563eb; color: #ffffff; border: none; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }

        .esnaf-link { display: block; text-align: center; margin-top: 30px; padding: 12px; background: rgba(30, 41, 59, 0.5); border: 1px solid #1e293b; border-radius: 14px; color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">hoop</div>
            <div class="sub-title">Ortaköy Mahallesi Canlı Fırsatları</div>
        </div>

        <div id="dealsContainer" class="deals-list">
            <!-- Varsayılan İlan 1 -->
            <div class="deal-card">
                <div class="deal-info">
                    <div class="deal-title">Özel Karışık Kumpir + İçecek</div>
                    <div class="price-box">
                        <span class="old-price">1000 TL</span>
                        <span class="new-price">750 TL</span>
                    </div>
                    <div class="meta-box">
                        <span>⏳ 45 Dk</span>
                        <span>⚡ Stok: 8/10</span>
                    </div>
                </div>
                <button class="btn-inspect">İncele ➔</button>
            </div>
        </div>

        <a href="esnaf.html" class="esnaf-link">🔒 hoop - Esnaf Girişi</a>
    </div>

    <script>
        function loadDeals() {
            const container = document.getElementById('dealsContainer');
            const deals = JSON.parse(localStorage.getItem('hoop_deals') || '[]');

            deals.forEach(deal => {
                const card = document.createElement('div');
                card.className = 'deal-card';
                card.innerHTML = `
                    <div class="deal-info">
                        <div class="deal-title">${deal.title}</div>
                        <div class="price-box">
                            ${deal.oldPrice ? `<span class="old-price">${deal.oldPrice}</span>` : ''}
                            <span class="new-price">${deal.newPrice}</span>
                        </div>
                        <div class="meta-box">
                            <span>⏳ ${deal.time}</span>
                            <span>⚡ Stok: ${deal.stock}</span>
                        </div>
                    </div>
                    <button class="btn-inspect">İncele ➔</button>
                `;
                container.prepend(card); // En yeni ekleneni en üste koyar
            });
        }

        window.onload = loadDeals;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoop - Ortaköy Esnaf Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #060913; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 16px 12px; }
        .app-container { width: 100%; max-width: 420px; background-color: #070a14; min-height: 100vh; padding: 20px 16px; border-radius: 24px; border: 1px solid #1e293b; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo { font-size: 22px; font-weight: 800; color: #38bdf8; letter-spacing: -0.5px; }
        .badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid rgba(56, 189, 248, 0.2); display: flex; align-items: center; gap: 6px; }

        /* PIN EKRANI */
        .pin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; gap: 16px; }
        .pin-icon { font-size: 42px; }
        .pin-title { font-size: 20px; font-weight: 800; color: #f8fafc; }
        .pin-sub { font-size: 13px; color: #64748b; max-width: 260px; line-height: 1.4; }
        .pin-input { background: #0f172a; border: 1.5px solid #334155; color: #38bdf8; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: 10px; width: 200px; padding: 12px; border-radius: 14px; outline: none; }
        .pin-btn { background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 200px; font-size: 15px; }

        /* YÖNETİM PANELİ VE FORM DÜZENİ */
        .dashboard { display: none; flex-direction: column; gap: 20px; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 20px; }
        .card-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
        input, select { width: 100%; background: #162032; border: 1px solid #283548; color: #fff; padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #2563eb; }

        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .row-2-custom { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }

        /* CANLI CÜMLE ÖNİZLEME KUTUSU */
        .preview-box { background: rgba(37, 99, 235, 0.1); border: 1px dashed #2563eb; border-radius: 14px; padding: 14px; margin-top: 8px; margin-bottom: 14px; }
        .preview-title { font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .preview-text { font-size: 13px; font-weight: 600; color: #e2e8f0; line-height: 1.5; }
        .preview-text highlight { color: #38bdf8; font-weight: 800; }

        .btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3); }
        .btn-back { background: transparent; color: #64748b; border: 1px solid #1e293b; text-align: center; text-decoration: none; display: block; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">hoop esnaf</div>
            <div class="badge">📍 Ortaköy</div>
        </div>

        <!-- PIN GİRİŞ EKRANI -->
        <div id="pinScreen" class="pin-screen">
            <div class="pin-icon">🔑</div>
            <div class="pin-title">Esnaf Giriş Şifresi</div>
            <div class="pin-sub">Lütfen 4 haneli güvenlik PIN kodunuzu girin.</div>
            <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
            <button class="pin-btn" onclick="checkPin()">Giriş Yap ➔</button>
        </div>

        <!-- YÖNETİM PANELİ -->
        <div id="dashboard" class="dashboard">
            <!-- FIRSAT YAYINLAMA KARTI -->
            <div class="card">
                <div class="card-title">⚡ Canlı Fırsat Oluştur</div>
                
                <!-- ÜRÜN / HİZMET ADI -->
                <div class="form-group">
                    <label>Ürün veya Hizmet Adı</label>
                    <input type="text" id="pName" placeholder="Örn: Dana Kıyma / Saç Tıraşı / Kumpir" oninput="updateSentence()">
                </div>

                <!-- NORMAL VE İNDİRİMLİ FİYAT -->
                <div class="row-2">
                    <div class="form-group">
                        <label>Normal Fiyat (₺)</label>
                        <input type="number" id="pOldPrice" placeholder="450" oninput="updateSentence()">
                    </div>
                    <div class="form-group">
                        <label>İndirimli Fiyat (₺)</label>
                        <input type="number" id="pNewPrice" placeholder="380" oninput="updateSentence()">
                    </div>
                </div>

                <!-- MİKTAR VE BİRİM SEÇİMİ -->
                <div class="row-2-custom">
                    <div class="form-group">
                        <label>Miktar / Stok</label>
                        <input type="number" id="pAmount" placeholder="10" oninput="updateSentence()">
                    </div>
                    <div class="form-group">
                        <label>Birim</label>
                        <select id="pUnit" onchange="updateSentence()">
                            <option value="Adet">Adet</option>
                            <option value="Kg">Kg</option>
                            <option value="Kişi">Kişi</option>
                            <option value="Litre">Litre</option>
                        </select>
                    </div>
                </div>

                <!-- BİTİŞ SAATİ -->
                <div class="form-group">
                    <label>Son Geçerlilik Saati</label>
                    <input type="text" id="pTime" placeholder="21:00" maxlength="5" oninput="updateSentence()">
                </div>

                <!-- CANLI OLUŞAN CÜMLE ÖNİZLEMESİ -->
                <div class="preview-box">
                    <div class="preview-title">📢 Yayınlanacak Fırsat Cümlesi</div>
                    <div class="preview-text" id="sentencePreview">
                        Lütfen yukarıdaki alanları doldurun...
                    </div>
                </div>

                <button class="btn" onclick="publishDeal()">Fırsatı Canlıya Al 🚀</button>
            </div>

            <!-- KUPON DOĞRULAMA KARTI -->
            <div class="card">
                <div class="card-title">🎟️ Kupon / Kod Doğrula</div>
                <div class="form-group">
                    <label>Müşteri Kodu</label>
                    <input type="text" placeholder="Örn: H-8942" style="text-transform: uppercase;">
                </div>
                <button class="btn" style="background: #059669;" onclick="alert('Kupon Onaylandı!')">Kuponu Onayla ✓</button>
            </div>

            <a href="index.html" class="btn-back">← Müşteri Sayfasına Dön</a>
        </div>
    </div>

    <script>
        function checkPin() {
            const input = document.getElementById('pinInput').value;
            if(input === "1999") {
                document.getElementById('pinScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
                updateSentence();
            } else {
                alert('Hatalı PIN Kodu! Lütfen tekrar deneyin.');
            }
        }

        /* Kelimelerin baş harflerini otomatik büyük yapma */
        function capitalize(str) {
            return str.replace(/\b\w/g, l => l.toLocaleUpperCase('tr-TR'));
        }

        /* Cümleyi Canlı Oluşturan Fonksiyon */
        function updateSentence() {
            const name = capitalize(document.getElementById('pName').value) || '...';
            const oldPrice = document.getElementById('pOldPrice').value || '...';
            const newPrice = document.getElementById('pNewPrice').value || '...';
            const amount = document.getElementById('pAmount').value || '...';
            const unit = document.getElementById('pUnit').value;
            const time = document.getElementById('pTime').value || '21:00';

            const sentence = `Bugün <highlight>${name}</highlight> fırsatını <highlight>${oldPrice} ₺</highlight> yerine <highlight>${newPrice} ₺</highlight> fiyatla, <highlight>${amount} ${unit}</highlight> ile saat <highlight>${time}</highlight>'e kadar yayınla.`;
            
            document.getElementById('sentencePreview').innerHTML = sentence;
        }

        function publishDeal() {
            const name = document.getElementById('pName').value;
            if(!name) {
                alert('Lütfen ürün veya hizmet adını girin.');
                return;
            }
            alert('Fırsatınız başarıyla canlıya alındı!');
        }
    </script>
</body>
</html>

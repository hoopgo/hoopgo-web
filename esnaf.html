<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoopGo - Esnaf</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

.container{
  width:92%;
  max-width:600px;
  margin:30px auto;
}

.header{
  background:#111827;
  color:white;
  padding:25px;
  border-radius:18px;
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:0 0 8px;
  font-size:28px;
}

.header p{
  margin:0;
  opacity:.8;
}

.panel{
  background:white;
  padding:24px;
  border-radius:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.hidden{
  display:none!important;
}

.input-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.login-btn{
  background:#111827;
  color:white;
}

.publish-btn{
  background:#16a34a;
  color:white;
}

.logout-btn{
  background:#dc2626;
  color:white;
}

button:disabled{
  opacity:.5;
}

.status{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:14px;
}

.status.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}

.user-box{
  background:#f3f4f6;
  padding:14px;
  border-radius:12px;
  margin-bottom:20px;
}

.image-box{
  border:2px dashed #ccc;
  border-radius:14px;
  padding:18px;
  text-align:center;
}

#fileNameDisplay{
  display:none;
  margin-top:8px;
  color:#16a34a;
  font-size:13px;
}

#imagePreview{
  display:none;
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:12px;
  margin-top:12px;
}

.price-row{
  display:flex;
  gap:10px;
}

.price-row .input-group{
  flex:1;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>HOOPGO</h1>
<p>Esnaf Paneli</p>
</div>


<!-- GİRİŞ -->

<div id="loginPanel" class="panel">

<h2>Esnaf Girişi</h2>

<div id="loginStatus" class="status"></div>

<div class="input-group">
<label>E-POSTA</label>
<input
  type="email"
  id="emailInput"
  placeholder="E-posta adresiniz">
</div>

<div class="input-group">
<label>ŞİFRE</label>
<input
  type="password"
  id="passwordInput"
  placeholder="Şifreniz">
</div>

<button
  class="login-btn"
  id="loginButton"
  onclick="girisYap()">
Giriş Yap
</button>

</div>


<!-- İLAN PANELİ -->

<div id="listingPanel" class="panel hidden">

<div class="user-box">
<strong>Esnaf Paneli</strong><br>
<span id="userEmail"></span>
</div>

<h2>Yeni İlan</h2>

<div id="listingStatus" class="status"></div>


<div class="input-group">
<label>ÜRÜN / İLAN BAŞLIĞI</label>

<input
  type="text"
  id="productTitle"
  placeholder="Örn: Kumpir">
</div>


<div class="input-group">

<label>ÜRÜN GÖRSELİ</label>

<div class="image-box">

<input
  type="file"
  id="productImageInput"
  accept="image/jpeg,image/png,image/webp"
  onchange="showFileName(this)">

</div>

<div id="fileNameDisplay"></div>

<img
  id="imagePreview"
  alt="Ürün önizleme">

</div>


<div class="price-row">

<div class="input-group">
<label>ESKİ FİYAT</label>

<input
  type="number"
  id="oldPrice"
  placeholder="0"
  min="0"
  step="0.01">
</div>


<div class="input-group">
<label>İNDİRİMLİ FİYAT</label>

<input
  type="number"
  id="salePrice"
  placeholder="0"
  min="0"
  step="0.01">
</div>

</div>


<div class="input-group">
<label>STOK</label>

<input
  type="number"
  id="stock"
  placeholder="Örn: 20"
  min="0">
</div>


<div class="input-group">
<label>GEÇERLİLİK</label>

<input
  type="text"
  id="validUntil"
  placeholder="Örn: Bugün 22:00'ye kadar">
</div>


<button
  class="publish-btn"
  id="publishButton"
  onclick="ilanYayinla()">
İlanı Yayınla
</button>


<button
  class="logout-btn"
  onclick="cikisYap()">
Çıkış Yap
</button>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
'https://ussqxddgtaflqkgqpcnf.supabase.co';

const SUPABASE_KEY =
'sb_publishable_1xxm0cRtO425-jC3dS-oRg_rh9Q6WrL';

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   MESAJ
================================ */

function mesaj(id,text,type){

const el=document.getElementById(id);

el.innerText=text;

el.className='status '+type;

}


/* ================================
   GİRİŞ
================================ */

async function girisYap(){

const email=
document.getElementById('emailInput')
.value.trim();

const password=
document.getElementById('passwordInput')
.value;

if(!email || !password){

mesaj(
'loginStatus',
'E-posta ve şifreyi girin.',
'error'
);

return;
}

const button=
document.getElementById('loginButton');

button.disabled=true;
button.innerText='Giriş yapılıyor...';


const {data,error}=
await supabaseClient.auth
.signInWithPassword({

email:email,
password:password

});


if(error){

mesaj(
'loginStatus',
'Giriş hatası: '+error.message,
'error'
);

button.disabled=false;
button.innerText='Giriş Yap';

return;
}


if(!data.user){

mesaj(
'loginStatus',
'Kullanıcı bulunamadı.',
'error'
);

button.disabled=false;
button.innerText='Giriş Yap';

return;
}


/* PROFİL KONTROLÜ */

const {
data:profile,
error:profileError
}=
await supabaseClient
.from('profiles')
.select('id,full_name,role')
.eq('id',data.user.id)
.single();


if(profileError){

await supabaseClient.auth.signOut();

mesaj(
'loginStatus',
'Profil bulunamadı: '+profileError.message,
'error'
);

button.disabled=false;
button.innerText='Giriş Yap';

return;
}


if(
profile.role!=='merchant' &&
profile.role!=='admin'
){

await supabaseClient.auth.signOut();

mesaj(
'loginStatus',
'Bu hesap esnaf hesabı değil.',
'error'
);

button.disabled=false;
button.innerText='Giriş Yap';

return;
}


/* PANELİ AÇ */

document.getElementById('userEmail')
.innerText=data.user.email;

document.getElementById('loginPanel')
.classList.add('hidden');

document.getElementById('listingPanel')
.classList.remove('hidden');

}


/* ================================
   GÖRSEL ÖNİZLEME
================================ */

function showFileName(input){

const display=
document.getElementById(
'fileNameDisplay'
);

const preview=
document.getElementById(
'imagePreview'
);


if(input.files && input.files[0]){

const file=input.files[0];

display.innerText=
'✓ Seçilen Görsel: '+file.name;

display.style.display='block';

preview.src=
URL.createObjectURL(file);

preview.style.display='block';

}

}


/* ================================
   İLAN YAYINLA
================================ */

async function ilanYayinla(){

const title=
document.getElementById(
'productTitle'
).value.trim();

const oldPrice=
document.getElementById(
'oldPrice'
).value;

const salePrice=
document.getElementById(
'salePrice'
).value;

const stock=
document.getElementById(
'stock'
).value;

const validUntil=
document.getElementById(
'validUntil'
).value.trim();

const imageInput=
document.getElementById(
'productImageInput'
);


if(!title){

mesaj(
'listingStatus',
'Ürün başlığını yazın.',
'error'
);

return;
}


if(!salePrice){

mesaj(
'listingStatus',
'İndirimli fiyatı yazın.',
'error'
);

return;
}


if(
!imageInput.files ||
!imageInput.files[0]
){

mesaj(
'listingStatus',
'Lütfen ürün görseli seçin.',
'error'
);

return;
}


const {
data:sessionData
}=
await supabaseClient.auth.getSession();

const session=
sessionData.session;


if(!session){

mesaj(
'listingStatus',
'Oturum bulunamadı. Tekrar giriş yapın.',
'error'
);

return;
}


const button=
document.getElementById(
'publishButton'
);

button.disabled=true;
button.innerText='Yükleniyor...';


try{

const user=session.user;

const file=imageInput.files[0];


if(file.size>5*1024*1024){

throw new Error(
'Görsel 5 MBdan büyük olamaz.'
);

}


/* DOSYA ADI */

const extension=
file.name
.split('.')
.pop()
.toLowerCase();

const fileName=
user.id+
'_'+
Date.now()+
'.'+
extension;


/* STORAGE */

const {
error:uploadError
}=
await supabaseClient
.storage
.from('listing-images')
.upload(
fileName,
file,
{
cacheControl:'3600',
upsert:false,
contentType:file.type
}
);


if(uploadError){

throw uploadError;

}


/* PUBLIC URL */

const {
data:urlData
}=
supabaseClient
.storage
.from('listing-images')
.getPublicUrl(fileName);

const imageUrl=
urlData.publicUrl;


/* VERİTABANI */

const {
error:insertError
}=
await supabaseClient
.from('listings')
.insert({

title:title,

image_url:imageUrl,

old_price:
oldPrice
?Number(oldPrice)
:null,

sale_price:
Number(salePrice),

stock:
stock
?Number(stock)
:null,

valid_until:
validUntil || null,

merchant_id:
user.id

});


if(insertError){

throw insertError;

}


/* BAŞARILI */

mesaj(
'listingStatus',
'🎉 İlan başarıyla yayınlandı!',
'success'
);


/* TEMİZLE */

document.getElementById(
'productTitle'
).value='';

document.getElementById(
'oldPrice'
).value='';

document.getElementById(
'salePrice'
).value='';

document.getElementById(
'stock'
).value='';

document.getElementById(
'validUntil'
).value='';

document.getElementById(
'productImageInput'
).value='';

document.getElementById(
'fileNameDisplay'
).style.display='none';

document.getElementById(
'imagePreview'
).style.display='none';

document.getElementById(
'imagePreview'
).src='';

}

catch(error){

console.error(error);

mesaj(
'listingStatus',
'Hata: '+error.message,
'error'
);

}


button.disabled=false;
button.innerText='İlanı Yayınla';

}


/* ================================
   ÇIKIŞ
================================ */

async function cikisYap(){

await supabaseClient.auth.signOut();

document.getElementById(
'listingPanel'
).classList.add('hidden');

document.getElementById(
'loginPanel'
).classList.remove('hidden');

document.getElementById(
'emailInput'
).value='';

document.getElementById(
'passwordInput'
).value='';

}


/* ================================
   SAYFA AÇILINCA OTURUM KONTROLÜ
================================ */

async function oturumKontrol(){

const {
data
}=
await supabaseClient.auth.getSession();

if(
data &&
data.session &&
data.session.user
){

document.getElementById(
'userEmail'
).innerText=
data.session.user.email;

document.getElementById(
'loginPanel'
).classList.add('hidden');

document.getElementById(
'listingPanel'
).classList.remove('hidden');

}

}

oturumKontrol();

</script>

</body>
</html>

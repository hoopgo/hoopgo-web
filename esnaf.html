<!DOCTYPE html>
<html lang="tr" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoop go - Esnaf Kayıt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #030712; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
        .app-container { width: 100%; max-width: 420px; background-color: #070a14; min-height: 100vh; padding: 20px 16px; border-radius: 20px; border: 1px solid #1e293b; display: flex; flex-direction: column; }
        
        /* LOGO */
        .header-section { text-align: center; padding: 10px 0 20px 0; }
        .logo-box { display: inline-flex; align-items: flex-end; justify-content: center; gap: 4px; }
        .logo-text { font-size: 36px; font-weight: 800; color: #ffffff; letter-spacing: -1px; display: flex; align-items: center; line-height: 1; }
        .oo-rings { display: inline-flex; align-items: center; position: relative; margin: 0 1px; transform: translateY(3px); }
        .ring-b { width: 20px; height: 20px; border: 4.5px solid #0088FF; border-radius: 50%; display: inline-block; margin-right: -7px; z-index: 1; }
        .ring-g { width: 20px; height: 20px; border: 4.5px solid #9ACD32; border-radius: 50%; display: inline-block; z-index: 2; }
        .go-tag { font-size: 15px; font-weight: 800; margin-bottom: 2px; margin-left: 2px; line-height: 1; }
        .g-b { color: #0088FF; }
        .o-g { color: #9ACD32; }

        .title { font-size: 18px; font-weight: 800; color: #f8fafc; margin-top: 10px; }
        .subtitle { color: #94a3b8; font-size: 12px; font-weight: 600; margin-top: 4px; }

        /* FORM STİLLERİ */
        .form-container { display: flex; flex-direction: column; gap: 14px; margin-top: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #cbd5e1; }
        .form-input, .form-select { background: #0f172a; border: 1px solid #1e293b; color: #ffffff; padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-input:focus, .form-select:focus { border-color: #0088FF; box-shadow: 0 0 0 2px rgba(0, 136, 255, 0.2); }
        .form-select option { background: #0f172a; color: #ffffff; }

        .btn-submit { background: #0088FF; color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { background: #0076e4; }

        .login-link { text-align: center; margin-top: 20px; font-size: 12px; color: #64748b; }
        .login-link a { color: #38bdf8; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body class="notranslate" translate="no">
    <div class="app-container">
        <!-- HEADER -->
        <header class="header-section">
            <div class="logo-box notranslate" translate="no">
                <div class="logo-text">
                    h<div class="oo-rings"><span class="ring-b"></span><span class="ring-g"></span></div>p
                </div>
                <div class="go-tag notranslate" translate="no">
                    <span class="g-b">g</span><span class="o-g">o</span>
                </div>
            </div>
            <h1 class="title">Esnaf Katılım Formu</h1>
            <p class="subtitle">Ortaköy'deki dükkanınızı hemen hoop go'ya taşıyın</p>
        </header>

        <!-- KAYIT FORM -->
        <form class="form-container" onsubmit="event.preventDefault(); registerShop();">
            <div class="form-group">
                <label>İşletme / Dükkan Adı</label>
                <input type="text" class="form-input" placeholder="Örn: Ortaköy Kasabı" required>
            </div>

            <div class="form-group">
                <label>Sektör / Kategori</label>
                <select class="form-select" required>
                    <option value="">Seçiniz...</option>
                    <option value="kasap">Kasap & Şarküteri</option>
                    <option value="restoran">Restoran & Kafe</option>
                    <option value="firin">Fırın & Pastane</option>
                    <option value="manav">Manav & Yeşillik</option>
                    <option value="kuruyemis">Kuruyemiş & Tatlı</option>
                    <option value="diger">Diğer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Yetkili Adı Soyadı</label>
                <input type="text" class="form-input" placeholder="Örn: Ahmet Yılmaz" required>
            </div>

            <div class="form-group">
                <label>Cep Telefonu</label>
                <input type="tel" class="form-input" placeholder="05XX XXX XX XX" required>
            </div>

            <div class="form-group">
                <label>Açık Adres (Ortaköy)</label>
                <input type="text" class="form-input" placeholder="Örn: Dereboyu Cad. No:12" required>
            </div>

            <div class="form-group">
                <label>Giriş Şifresi Oluştur</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Kayıt Ol ve Başla</button>
        </form>

        <div class="login-link">
            Zaten bir hesabınız var mı? <a href="#">Giriş Yap</a>
        </div>
    </div>

    <script>
        function registerShop() {
            alert('🎉 Başvurunuz alındı! Esnaf panelinize yönlendiriliyorsunuz...');
            // Bir sonraki adımda oluşturacağımız esnaf paneline yönlendireceğiz
        }
    </script>
</body>
</html>

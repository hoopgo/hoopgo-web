<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoop - Esnaf Girişi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #070a14;
            min-height: 100vh;
            padding: 16px 14px 40px 14px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 10px 0 14px 0;
            border-bottom: 1px solid #1e293b;
        }

        .logo-img {
            height: 44px;
            object-fit: contain;
        }

        .header-title {
            font-size: 14px;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 6px;
            letter-spacing: -0.2px;
        }

        /* CARD PANEL */
        .panel-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            width: 100%;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 800;
            color: #f3f4f6;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* INPUT GRIDS */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            width: 100%;
        }

        .form-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 0; /* Taşmayı önler */
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: #9ca3af;
        }

        input, select {
            width: 100%;
            background-color: #1a2333;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        /* BUTTONS */
        .btn-primary {
            width: 100%;
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
            margin-top: 4px;
        }

        .btn-approve {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        /* HİZMET BEDELİ BİLGİ KUTUSU */
        .info-box {
            background: rgba(52, 211, 153, 0.08);
            border: 1px dashed #34d399;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            color: #34d399;
            font-weight: 700;
            margin-top: 4px;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .footer-back {
            text-align: center;
            margin-top: 10px;
        }

        .btn-back-link {
            color: #6b7280;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <div class="header">
            <img src="logo.png.jpeg" alt="hoop logo" class="logo-img">
            <div class="header-title">hoop Esnaf Girişi</div>
        </div>

        <!-- MÜŞTERİ KOD ONAYI -->
        <div class="panel-card">
            <div class="panel-title">🎟️️ Müşteri Kod Onayı</div>
            <div class="form-row" style="align-items: center;">
                <div class="form-group" style="margin-bottom:0;">
                    <input type="text" placeholder="3 Haneli Kod" maxlength="3" style="text-align: center; font-size: 16px; letter-spacing: 2px;">
                </div>
                <button class="btn-approve" onclick="alert('Kupon başarıyla doğrulandı ve uygulandı!')">Onayla</button>
            </div>
        </div>

        <!-- YENİ CANLI FIRSAT YAYINLA -->
        <div class="panel-card">
            <div class="panel-title">🚀 Yeni Canlı Fırsat Yayınla</div>
            
            <div class="form-group">
                <label>Ürün / Fırsat Başlığı</label>
                <input type="text" placeholder="Örn: Özel Karışık Kumpir + İçecek">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Normal Fiyat (TL)</label>
                    <input type="number" placeholder="1000">
                </div>
                <div class="form-group">
                    <label>Fırsat Fiyatı (TL)</label>
                    <input type="number" placeholder="750">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Stok Adedi</label>
                    <input type="number" placeholder="10">
                </div>
                <div class="form-group">
                    <label>Yayın Süresi</label>
                    <select>
                        <option>30 Dakika</option>
                        <option selected>60 Dakika</option>
                        <option>120 Dakika</option>
                    </select>
                </div>
            </div>

            <div class="info-box">
                Hizmet Bedeli: %10 ➔ <strong>0 TL (Pilot Ücretsiz)</strong>
            </div>

            <button class="btn-primary" onclick="alert('Fırsat başarıyla canlıya alındı!')">Fırsatı Canlıya Al ⚡</button>
        </div>

        <div class="footer-back">
            <a href="index.html" class="btn-back-link">← Ana Sayfaya / Müşteri Görünümüne Dön</a>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hoop - Esnaf Portalı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #111c38; border: 1px solid #1f2d5a; border-radius: 16px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        /* Orijinal Logo Alanı - Doğrudan Gömmeli SVG */
        .logo-box { width: 200px; margin: 0 auto 12px auto; display: block; }
        .logo-box svg { width: 100%; height: auto; display: block; }
        
        .subtitle { font-size: 18px; font-weight: 600; color: #ffffff; margin-bottom: 6px; }
        .desc { font-size: 13px; color: #8a99ad; margin-bottom: 24px; }
        
        .tab-group { display: flex; background: #0b1329; border-radius: 8px; padding: 4px; margin-bottom: 24px; }
        .tab { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .tab.active { background: #1e3a8a; color: #ffffff; }
        .tab.inactive { background: transparent; color: #8a99ad; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: 700; color: #8a99ad; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px 14px; background: #0b1329; border: 1px solid #1f2d5a; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none; }
        input::placeholder { color: #4a5b73; }
        select { color: #ffffff; appearance: none; }
        
        .btn { width: 100%; padding: 14px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }

        /* Onay Kartı */
        .success-card {
            display: none;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid #10b981;
            border-radius: 12px;
            padding: 24px 16px;
            margin-top: 10px;
            text-align: center;
        }
        .success-card .icon { font-size: 36px; color: #10b981; margin-bottom: 10px; }
        .success-card .title { font-size: 17px; font-weight: 700; color: #10b981; margin-bottom: 6px; }
        .success-card .msg { font-size: 13px; color: #d1fae5; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <!-- Dahili Orijinal Logo -->
    <div class="logo-box">
        <svg viewBox="0 0 340 100" xmlns="http://www.w3.org/2000/svg">
            <!-- h -->
            <path d="M 20 15 C 28 15 35 22 35 30 L 35 45 C 42 37 52 33 63 33 C 80 33 90 44 90 62 L 90 85 C 90 93 83 100 75 100 C 67 100 60 93 60 85 L 60 65 C 60 57 55 52 47 52 C 39 52 35 57 35 65 L 35 85 C 35 93 28 100 20 100 C 12 100 5 93 5 85 L 5 30 C 5 22 12 15 20 15 Z" fill="#ffffff"/>
            <!-- Mavi Halka -->
            <circle cx="115" cy="66" r="28" fill="none" stroke="#0072ff" stroke-width="14" stroke-linecap="round"/>
            <!-- Yeşil Halka -->
            <circle cx="160" cy="66" r="28" fill="none" stroke="#8cae62" stroke-width="14" stroke-linecap="round"/>
            <!-- Kesişim / İç İçe Geçme Katmanı -->
            <path d="M 130 42 A 28 28 0 0 1 145 52" fill="none" stroke="#0072ff" stroke-width="14" stroke-linecap="round"/>
            <!-- p -->
            <path d="M 210 35 C 218 35 225 42 225 50 L 225 53 C 232 43 243 35 257 35 C 280 35 295 52 295 72 C 295 92 280 109 257 109 C 243 109 232 101 225 91 L 225 105 C 225 113 218 120 210 120 C 202 120 195 113 195 105 L 195 50 C 195 42 202 35 210 35 Z M 245 53 C 234 53 225 61 225 72 C 225 83 234 91 245 91 C 256 91 265 83 265 72 C 265 61 256 53 245 53 Z" fill="#ffffff"/>
        </svg>
    </div>

    <div class="subtitle">Esnaf Portalı</div>
    <div class="desc">İşletmenizi hoop go ekosistemine taşıyın</div>

    <div class="tab-group">
        <button class="tab active">İşletme Kaydı</button>
        <button class="tab inactive">Esnaf Girişi</button>
    </div>

    <!-- Başvuru Formu -->
    <form id="esnafForm">
        <div class="form-group">
            <label>İŞLETME / DÜKKAN TİCARİ ÜNVANI</label>
            <input type="text" placeholder="Örn: Ortaköy Fırını" required>
        </div>

        <div class="form-group">
            <label>İŞLETME KATEGORİSİ</label>
            <select required>
                <option value="" disabled selected>Kategori Seçiniz</option>
                <option value="restoran">Restoran / Kafe</option>
                <option value="firin">Fırın / Pastane</option>
                <option value="market">Market / Şarküteri</option>
                <option value="kasap">Kasap / Manav</option>
                <option value="diger">Diğer Hizmetler</option>
            </select>
        </div>

        <div class="form-group">
            <label>İŞLETME ADRESİ VE NİRENGİ NOKTASI</label>
            <input type="text" placeholder="Örn: Dereboyu Cad. No: 12 (Cami Karşısı)" required>
        </div>

        <div class="form-group">
            <label>YETKİLİ ADI SOYADI</label>
            <input type="text" placeholder="Ad Soyad" required>
        </div>

        <div class="form-group">
            <label>TELEFON NUMARASI</label>
            <input type="tel" placeholder="05XX XXX XX XX" required>
        </div>

        <button type="submit" class="btn">Başvuruyu Tamamla</button>
    </form>

    <!-- Onay Kartı -->
    <div class="success-card" id="successCard">
        <div class="icon">✓</div>
        <div class="title">Başvurunuz Alındı</div>
        <div class="msg">İşletme kaydınız incelemeye alınmıştır. Admin onayının ardından hesabınız aktif edilecek ve iletişim numaranıza bilgi iletilecektir.</div>
    </div>
</div>

<script>
    document.getElementById('esnafForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('esnafForm').style.display = 'none';
        document.getElementById('successCard').style.display = 'block';
    });
</script>

</body>
</html>

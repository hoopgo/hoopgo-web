<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>hoop - Esnaf Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #060913; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; padding: 16px 14px; }
        .app-container { width: 100%; max-width: 480px; background-color: #070a14; min-height: 100vh; padding: 16px; border-radius: 20px; border: 1px solid #1e293b; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: 800; color: #38bdf8; }
        .badge { background: #1e293b; color: #94a3b8; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        
        /* PIN EKRANI STİLLERİ */
        .pin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; gap: 16px; }
        .pin-title { font-size: 18px; font-weight: 800; color: #f8fafc; }
        .pin-sub { font-size: 13px; color: #64748b; }
        .pin-input { background: #0f172a; border: 1px solid #334155; color: #38bdf8; font-size: 24px; font-weight: 800; text-align: center; letter-spacing: 12px; width: 180px; padding: 12px; border-radius: 12px; outline: none; }
        .pin-btn { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 180px; font-size: 14px; }
        
        /* PANEL KARTLARI */
        .dashboard { display: none; flex-direction: column; gap: 16px; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; }
        .card-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; color: #f8fafc; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
        input, select { width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
        .btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 8px; }
        .btn-back { background: transparent; color: #64748b; border: 1px solid #334155; text-align: center; text-decoration: none; display: block; margin-top: 16px; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">hoop esnaf</div>
            <div class="badge">🔒 Esnaf Paneli</div>
        </div>

        <!-- PIN GİRİŞ EKRANI -->
        <div id="pinScreen" class="pin-screen">
            <div style="font-size: 40px;">🔑</div>
            <div class="pin-title">Esnaf Giriş Şifresi</div>
            <div class="pin-sub">Lütfen 4 haneli güvenlik PIN kodunuzu girin.</div>
            <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
            <button class="pin-btn" onclick="checkPin()">Giriş Yap ➔</button>
        </div>

        <!-- YÖNETİM PANELİ (GİRİŞ YAPILINCA AÇILIR) -->
        <div id="dashboard" class="dashboard">
            <div class="card">
                <div class="card-title">⚡ Yeni Canlı Fırsat Yayınla</div>
                <div class="form-group">
                    <label>Fırsat / Ürün Adı</label>
                    <input type="text" placeholder="Örn: Karışık Kumpir + İçecek">
                </div>
                <div class="form-group">
                    <label>İndirimli Fiyat (₺)</label>
                    <input type="number" placeholder="750">
                </div>
                <div class="form-group">
                    <label>Stok Adedi</label>
                    <input type="number" placeholder="5">
                </div>
                <button class="btn" onclick="alert('Fırsatınız canlıya alındı!')">Fırsatı Canlıya Al 🚀</button>
            </div>

            <a href="index.html" class="btn-back">← Müşteri Sayfasına Dön</a>
        </div>
    </div>

    <script>
        function checkPin() {
            const input = document.getElementById('pinInput').value;
            // Varsayılan PIN: 1999
            if(input === "1999") {
                document.getElementById('pinScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
            } else {
                alert('Hatalı PIN Kodu! Lütfen tekrar deneyin.');
            }
        }
    </script>
</body>
</html>
